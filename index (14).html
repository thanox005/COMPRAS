<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Lista da Feira</title>
<style>
  :root {
    --verde: #2e7d32;
    --verde-claro: #e8f5e9;
    --cinza: #607d8b;
    --fundo: #f5f7f5;
    --branco: #ffffff;
    --texto: #1b1b1b;
    --vermelho: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  header {
    background: var(--verde);
    color: #fff;
    padding: 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header small { opacity: .85; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  form.add {
    background: var(--branco);
    border-radius: 12px;
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 70px 90px;
    gap: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  form.add input, form.add select {
    font: inherit;
    padding: 10px;
    border: 1px solid #cfd8dc;
    border-radius: 8px;
    min-width: 0;
  }
  form.add .nome { grid-column: 1 / -1; }
  form.add button {
    grid-column: 1 / -1;
    font: inherit;
    font-weight: 600;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: var(--verde);
    color: #fff;
    cursor: pointer;
    min-height: 44px;
  }

  .barra {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 16px 4px 8px;
    font-size: .9rem;
    color: var(--cinza);
  }
  .barra button {
    background: none;
    border: 0;
    color: var(--vermelho);
    font: inherit;
    cursor: pointer;
    padding: 6px;
  }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: var(--branco);
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  li input[type="checkbox"] {
    width: 22px;
    height: 22px;
    accent-color: var(--verde);
    flex-shrink: 0;
    cursor: pointer;
  }
  .info { flex: 1; min-width: 0; cursor: pointer; }
  .nome-item { font-weight: 600; word-break: break-word; }
  .qtd { font-size: .85rem; color: var(--cinza); }
  li.feito .nome-item { text-decoration: line-through; color: #9e9e9e; }
  li.feito { opacity: .7; }
  .cat {
    font-size: .7rem;
    background: var(--verde-claro);
    color: var(--verde);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .del {
    background: none;
    border: 0;
    color: #9e9e9e;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 6px;
    min-width: 36px;
    min-height: 36px;
  }
  .del:hover { color: var(--vermelho); }
  .vazio {
    text-align: center;
    color: var(--cinza);
    padding: 32px 0;
  }
  .compartilhar {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    font: inherit;
    font-weight: 600;
    border: 1px solid var(--verde);
    border-radius: 8px;
    background: var(--branco);
    color: var(--verde);
    cursor: pointer;
    min-height: 44px;
  }
</style>
</head>
<body>

<header>
  <h1>🛒 Lista da Feira</h1>
  <small id="resumo">0 itens</small>
</header>

<main>
  <form class="add" id="form">
    <input class="nome" id="nome" type="text" placeholder="O que comprar?" maxlength="60" required autocomplete="off">
    <input id="qtd" type="number" min="1" step="any" value="1" aria-label="Quantidade">
    <select id="unidade" aria-label="Unidade">
      <option value="un">un</option>
      <option value="kg">kg</option>
      <option value="g">g</option>
      <option value="L">L</option>
      <option value="ml">ml</option>
      <option value="pct">pct</option>
      <option value="dz">dz</option>
    </select>
    <select id="categoria" class="nome" aria-label="Categoria">
      <option value="">Sem categoria</option>
      <option>Hortifruti</option>
      <option>Carnes</option>
      <option>Laticínios</option>
      <option>Padaria</option>
      <option>Mercearia</option>
      <option>Bebidas</option>
      <option>Limpeza</option>
      <option>Higiene</option>
      <option>Outros</option>
    </select>
    <button type="submit">Adicionar</button>
  </form>

  <div class="barra">
    <span id="contador"></span>
    <button id="limparFeitos" type="button">Remover marcados</button>
  </div>

  <ul id="lista"></ul>
  <div class="vazio" id="vazio">Sua lista está vazia.</div>

  <button class="compartilhar" id="compartilhar" type="button">📤 Compartilhar lista</button>
</main>

<script>
  const CHAVE = "lista-feira-v1";
  let itens = carregar();

  const form = document.getElementById("form");
  const nomeEl = document.getElementById("nome");
  const qtdEl = document.getElementById("qtd");
  const unidadeEl = document.getElementById("unidade");
  const categoriaEl = document.getElementById("categoria");
  const lista = document.getElementById("lista");
  const vazio = document.getElementById("vazio");
  const resumo = document.getElementById("resumo");
  const contador = document.getElementById("contador");

  function carregar() {
    try {
      return JSON.parse(localStorage.getItem(CHAVE)) || [];
    } catch {
      return [];
    }
  }

  function salvar() {
    localStorage.setItem(CHAVE, JSON.stringify(itens));
  }

  function escapar(texto) {
    const d = document.createElement("div");
    d.textContent = texto;
    return d.innerHTML;
  }

  function render() {
    // Não marcados primeiro, depois por nome
    const ordenados = [...itens].sort((a, b) =>
      a.feito - b.feito || a.nome.localeCompare(b.nome, "pt-BR")
    );

    lista.innerHTML = ordenados.map(item => `
      <li class="${item.feito ? "feito" : ""}" data-id="${item.id}">
        <input type="checkbox" ${item.feito ? "checked" : ""} aria-label="Marcar ${escapar(item.nome)}">
        <div class="info">
          <div class="nome-item">${escapar(item.nome)}</div>
          <div class="qtd">${item.qtd} ${escapar(item.unidade)}</div>
        </div>
        ${item.categoria ? `<span class="cat">${escapar(item.categoria)}</span>` : ""}
        <button class="del" aria-label="Excluir ${escapar(item.nome)}">×</button>
      </li>
    `).join("");

    const feitos = itens.filter(i => i.feito).length;
    vazio.style.display = itens.length ? "none" : "block";
    resumo.textContent = `${itens.length} ${itens.length === 1 ? "item" : "itens"}`;
    contador.textContent = `${feitos} de ${itens.length} marcados`;
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const nome = nomeEl.value.trim();
    if (!nome) return;

    itens.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      nome: nome.charAt(0).toUpperCase() + nome.slice(1),
      qtd: qtdEl.value || "1",
      unidade: unidadeEl.value,
      categoria: categoriaEl.value,
      feito: false
    });

    salvar();
    render();
    form.reset();
    qtdEl.value = 1;
    nomeEl.focus();
  });

  lista.addEventListener("click", e => {
    const li = e.target.closest("li");
    if (!li) return;
    const item = itens.find(i => i.id === li.dataset.id);
    if (!item) return;

    if (e.target.classList.contains("del")) {
      itens = itens.filter(i => i.id !== item.id);
    } else if (e.target.type === "checkbox" || e.target.closest(".info")) {
      item.feito = !item.feito;
    } else {
      return;
    }
    salvar();
    render();
  });

  document.getElementById("limparFeitos").addEventListener("click", () => {
    if (!itens.some(i => i.feito)) return;
    if (!confirm("Remover todos os itens marcados?")) return;
    itens = itens.filter(i => !i.feito);
    salvar();
    render();
  });

  document.getElementById("compartilhar").addEventListener("click", () => {
    if (!itens.length) return alert("A lista está vazia.");
    const texto = "🛒 Lista da Feira\n\n" + itens
      .map(i => `${i.feito ? "✅" : "⬜"} ${i.nome} - ${i.qtd} ${i.unidade}`)
      .join("\n");
    if (navigator.share) {
      navigator.share({ title: "Lista da Feira", text: texto }).catch(() => {});
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
    }
  });

  render();
</script>
</body>
</html>
